
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    volumes:
      - zookeeper_data_vol:/var/lib/zookeeper/data
    networks:
      - iot-network
    healthcheck:
      test: echo stat | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 3
    
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - iot-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    networks:
      - iot-network
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo '=== Aspetto che Kafka sia pronto ===';
      sleep 10;
      echo '=== Creazione topic iot_sensors ===';
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic iot_sensors --partitions 1 --replication-factor 1;
      echo '=== Verifica topics creati ===';
      kafka-topics --bootstrap-server kafka:9092 --list;
      echo '=== Inizializzazione completata ===';
      "

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      # Credenziali e configurazione di InfluxDB 2.x
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=poloa_admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password
      - DOCKER_INFLUXDB_INIT_ORG=POLOA_org
      - DOCKER_INFLUXDB_INIT_BUCKET=temporal_datalake # Il bucket che riceverà i dati
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-influxdb-token # Necessario per il connettore Sink
    volumes:
      - influxdb_data_vol:/var/lib/influxdb2
    networks:
      - iot-network


  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.0
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      mqtt_broker:
        condition: service_started
      influxdb:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: "connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC: "connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: "org.reflections=ERROR"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    volumes:
      - ./kafka-connect-plugins:/usr/share/confluent-hub-components
      - ./connectors:/connectors
    networks:
      - iot-network
    
  init-connectors:
    image: curlimages/curl:latest
    container_name: init-connectors
    depends_on:
      - kafka-connect
    volumes:
      - ./init-connectors.sh:/init-connectors.sh
      - ./connectors:/connectors
    entrypoint: ["sh", "/init-connectors.sh"]
    networks:
      - iot-network
      
  mongo:
    image: mongo:6
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_vol:/data/db
    networks:
      - iot-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      
  spark:
    image: apache/spark:3.5.0
    container_name: spark
    user: root
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./spark-app:/app
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - iot-network
      
  spark-job:
    build: ./spark-app
    container_name: spark-job
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    volumes:
      - ./spark-app:/app
    networks:
      - iot-network
    restart: on-failure
    entrypoint: >
      sh -c "
      echo '=== Verifica topic Kafka ===';
      kafka-topics --bootstrap-server kafka:9092 --list;
      echo '=== Avvio Spark Job ===';
      /opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      /app/spark_main.py
      "

  spark-batch:
    build: ./spark-app
    container_name: spark-batch
    depends_on:
      influxdb:
        condition: service_started
      mongo:
        condition: service_healthy
    volumes:
      - ./spark-app:/app
    networks:
      - iot-network
    restart: "no"
    labels:
      # JDaily job: at 02:00
      ofelia.job-local.daily-report.schedule: "@daily 02:00"
      ofelia.job-local.daily-report.command: >
        /opt/spark/bin/spark-submit 
        --packages org.mongodb.spark:mongo-spark-connector_2.12:10.2.1
        /app/daily_report.py

      # Weekly job: Sunday at midnight
      ofelia.job-local.weekly-check.schedule: "@weekly"
      ofelia.job-local.weekly-check.command: >
        /opt/spark/bin/spark-submit 
        --packages org.mongodb.spark:mongo-spark-connector_2.12:10.2.1
        /app/daily_report.py
    # Mantains the container on container acceso but in idle state
    entrypoint: [ "tail", "-f", "/dev/null" ]

  #wakes up the spark-batch container to run scheduled jobs
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: scheduler
    depends_on:
      - spark-batch
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - iot-network


  telegraf:
    image: telegraf:latest
    container_name: telegraf
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_started
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - iot-network
    restart: always

  mqtt_broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data_vol:/mosquitto/data
    networks:
      - iot-network


  thingsboard:
    image: thingsboard/tb-postgres:latest
    container_name: thingsboard
    restart: always
    ports:
      - "9191:9090"
      - "1884:1883"
    environment:
      - TB_QUEUE_TYPE=in-memory
      - JAVA_OPTS=-Xms512M -Xmx2G
    volumes:
      - tb_data:/data
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s  

  
  etl-extractor:
    build: ./etl_jobs
    container_name: etl-extractor
    restart: always
    depends_on:
      thingsboard:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - TB_URL=http://thingsboard:9090
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=iot_sensors
      - TB_USER=tenant@thingsboard.org
      - TB_PASS=tenant
    volumes:
      - ./etl_jobs:/app 
      - etl_state:/app/state  
    command: ["python", "-u", "extract_from_thingsboard.py"]        
    networks:
      - iot-network

  
  etl-loader:
    build: ./etl_jobs
    container_name: etl-loader
    restart: always
    depends_on:
      thingsboard:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      - TB_URL=http://thingsboard:9090
      - MONGO_URI=mongodb://mongo:27017/
      - MONGO_DB=building_iot
      - MONGO_COLLECTION=aggr_iot_metrics
      - TB_USER=tenant@thingsboard.org
      - TB_PASS=tenant
    volumes:
      - ./etl_jobs:/app
      - etl_state:/app/state  
    command: ["python", "-u", "insert_to_thingsboard.py"]
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  zookeeper_data_vol:
  influxdb_data_vol:
  mongo_data_vol:
  mosquitto_data_vol:
  tb_data:
  etl_state:  
